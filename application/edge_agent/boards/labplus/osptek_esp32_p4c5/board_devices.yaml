  # Button Devices — one device per GPIO (dev_button only supports single GPIO)
  - name: confirm_button
    type: button
    sub_type: gpio                 # Button sub type: "gpio", "adc_single", or "adc_multi"
    config:
      # GPIO Configuration
      active_level: 0              # [TO_BE_CONFIRMED] Active level (0-low, 1-high) when button is pressed
      enable_power_save: false     # Enable power save mode (default: false)
      disable_pull: false          # Disable internal pull-up/pull-down (default: false)
      # Button Timing Configuration
      long_press_time: 2000        # Long press time in milliseconds (default: 2000)
      short_press_time: 100        # Short press time in milliseconds (default: 100)
      events_cfg:
        press_down: true           # Enable press down event (default: true)
        press_up: true             # Enable press up event (default: true)
        single_click: true         # Enable single click event (default: true)
        double_click: true         # Enable double click event (default: true)
        multi_click: false         # Enable multi click event (default: false)
        click_counts: []           # Multi click counts configuration (default: [])
                                    # eg: Set to [3, 4] means enable multi_click event with 3 and 4 counts
        long_press_start: true     # Enable long press start event (default: true)
        long_press_start_time: []  # Long press start time configuration in ms (default: [])
                                    # eg: Set to [3000, 4000] means enable long_press_start event with 3 and 4 seconds
        long_press_hold: false     # Enable long press hold event (default: false)
        long_press_up: true        # Enable long press up event (default: true)
        long_press_up_time: []     # Long press up time configuration in ms (default: [])
        press_repeat: false        # Enable press repeat event (default: false)
        press_repeat_done: false   # Enable press repeat done event (default: false)
        press_end: false           # Enable press end event (default: false)

    peripherals:
      - name: gpio_confirm_button                 # [TO_BE_CONFIRMED] GPIO peripheral name

  # Battery Voltage ADC Sampling Service
  # Keep the original ADC_ATTEN_DB_12 configuration (approximately 0-3.3 V).
  # With Q5 enabled, the 100K/100K divider feeds 0-2.1 V at ADC1_CH4
  # for a 0-4.2 V VBAT range.
  # - name: battery_adc
  #   type: custom
  #   chip: adc_battery
  #   version: default
  #   config:
  #     adc_unit: 1                      # ADC_UNIT_1 (ADC1)
  #     channel: 4                       # ADC_CHANNEL_4 (GPIO5 - ADC1_CH4)
  #     bitwidth: 12                     # ADC_BITWIDTH_12 (12-bit, 0-4095)
  #     attenuation: 3                   # ADC_ATTEN_DB_12 (theoretical 0-3.3V; 100K/100K divider output 0-2.1V)
  #     samples: 8                       # Average 8 samples for noise reduction
  #     sampling_freq_hz: 1              # Sample once per second
  #     description: "Battery monitoring: ADC range 0-3.3V; 100K/100K divider output 0-2.1V for 0-4.2V VBAT"
  #   peripherals:
  #     - name: adc_battery

  # VBUS Charging Detection Device
  # - name: vbus_detector
  #   type: custom
  #   chip: gpio_vbus
  #   version: default
  #   config:
  #     gpio: 14
  #     active_level: 1                   # High = external power present
  #     debounce_ms: 20                   # Debounce period
  #     description: "Type-C VBUS detection for charging status"
  #   peripherals:
  #     - name: gpio_vbus

  # microSD card on SDMMC 4-bit bus. Shares GPIO20~25 stuffing option with SPI NAND.
  - name: fs_sdcard
    type: fs_fat
    sub_type: sdmmc
    version: default
    config:
      sub_config:
        # Use SDMMC slot 0
        slot: SDMMC_HOST_SLOT_0
        frequency: SDMMC_FREQ_HIGHSPEED
        bus_width: 4
        # If using slot 0, the pin must be configured as 0, the IO pins actually used are configured by the SDMMC driver
        # For more details, please check https://github.com/espressif/esp-idf/blob/v5.5.1/components/esp_driver_sdmmc/src/sdmmc_host.c#L668
        pins:
          clk: 0
          cmd: 0
          d0: 0
          d1: 0
          d2: 0
          d3: 0
          d4: 0
          d5: 0
          d6: 0
          d7: 0
        ldo_chan_id: 4  # Use LDO_VO4 to power SDMMC IO

