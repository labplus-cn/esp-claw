board: osptek_esp32_p4c5
chip: esp32p4
version: 1.0.0
# Devices Configuration
devices:
  - name: audio_dac
    # Physical codec is ES8390; esp_codec_dev uses the compatible ES8389 driver key.
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: false
      dac_enabled: true
      dac_max_channel: 1
      # DAC channel mask, 1-enable, 0-disable, layout: left,right
      dac_channel_mask: "1"     # Both channels enable
      mclk_enabled: true

    # Power amplifier configuration
    peripherals:
      - name: gpio_pa_control
        gain: 6                    # dB
        active_level: 1            # 0-low, 1-high
      - name: i2s_audio_out
      - name: i2c_master
        address: 0x30              # ES8311 8-bit addr (driver >>1 for new I2C API)
        frequency: 400000          # Hz

  - name: audio_adc
    # Physical codec is ES8390; esp_codec_dev uses the compatible ES8389 driver key.
    chip: es8311
    type: audio_codec
    version: default
    config:
      adc_enabled: true
      adc_max_channel: 1
      adc_channel_mask: "11"
      adc_channel_labels: ['RE', 'FC'] # MSB ~ LSB, ch1 = reference, ch0 = microphone
      adc_init_gain: 0           # dB
      mclk_enabled: true

    # Power amplifier configuration
    peripherals:
      # I2S interface configuration
      - name: i2s_audio_in
      # I2C interface configuration
      - name: i2c_master
        address: 0x30              # ES8311 8-bit addr (driver >>1 for new I2C API)
        frequency: 400000          # Hz

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 80
    peripherals:
      - name: ledc_backlight

  # Onboard passive buzzer on P12 (GPIO21)
  # - name: buzzer
  #   type: ledc_ctrl
  #   version: default
  #   config:
  #     default_percent: 0
  #   peripherals:
  #     - name: ledc_buzzer

  - name: display_lcd
    chip: st7701s
    type: display_lcd
    sub_type: dsi
    dependencies:
      espressif/esp_lcd_st7701: "2.0.2"
    config:
      reset_gpio_num: 5
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      bits_per_pixel: 24
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 15
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB888
        # in_color_format: LCD_COLOR_PIXEL_FORMAT_RGB888
        # out_color_format: 0
        num_fbs: 1
        flags:
          use_dma2d: true
        video_timing:
          h_size: 480
          v_size: 854
          hsync_back_porch: 30
          hsync_pulse_width: 2
          hsync_front_porch: 50
          vsync_back_porch: 10
          vsync_pulse_width: 8
          vsync_front_porch: 20
    peripherals:
      - name: ldo_mipi
      - name: dsi_display

  # FT5316D Capacitive Touch Panel
  - name: lcd_touch
    chip: ft5x06
    type: lcd_touch
    sub_type: i2c
    version: default
    dependencies:
      esp_lcd_touch:
        version: "*"
        require: public
      espressif/esp_lcd_touch_ft5x06: "^1.0.0"
    config:
      io_i2c_config:
        lcd_cmd_bits: 8
        scl_speed_hz: 400000
      touch_config:
        x_max: 480
        y_max: 854
        rst_gpio_num: 6                   # IO6 - Touch reset
        int_gpio_num: 21                  # IO21 - Touch interrupt
        levels:
          reset: 0                        # Active low
          interrupt: 0                    # Active low
        flags:
          mirror_x: true                  # Mirror X coordinates
    peripherals:
      - name: i2c_master
        i2c_addr: [0x70]                  # FT5316D 8-bit I2C address

  # OV2710 MIPI-CSI Camera
  - name: camera
    type: camera
    sub_type: csi
    config:
      csi_config:
        reset_io: 29                   # GPIO29 - Camera reset
        pwdn_io: -1                    # Not connected
        dont_init_ldo: true            # Board manager manages MIPI LDO
        xclk_config:
          xclk_pin: -1                 # MIPI CSI sensor generates its own clock

    peripherals:
      - name: i2c_master               # Shared I2C bus (SCCB)
        frequency: 100000
      - name: ldo_mipi                 # Shared MIPI LDO with DSI display

