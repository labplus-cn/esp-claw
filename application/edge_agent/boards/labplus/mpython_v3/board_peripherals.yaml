version: 1.0.0
# Peripheral configuration for the Labplus mPython V3.
#
# The pin map is shared with the existing mPython V3 firmware Board Manager
# definition. GPIOs used by the ESP32-S3 module's flash/PSRAM interface are
# intentionally not exposed here.

peripherals:
  - name: i2c_master
    type: i2c
    role: master
    config:
      port: 0
      pins:
        sda: 44
        scl: 43

  - name: i2s_audio_out
    type: i2s
    role: master
    format: std-out
    config: &i2s_config
      port: 0
      sample_rate_hz: 16000
      mclk_multiple: 256
      data_bit_width: 16
      slot_bit_width: I2S_SLOT_BIT_WIDTH_AUTO
      slot_mode: I2S_SLOT_MODE_STEREO
      slot_mask: I2S_STD_SLOT_BOTH
      ws_width: 16
      total_slot: 2
      pins:
        mclk: 39
        bclk: 41
        ws: 42
        dout: 38
        din: 40

  - name: i2s_audio_in
    type: i2s
    role: master
    format: std-in
    config: *i2s_config

  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 37
        sclk_io_num: 36
        max_transfer_sz: 110080

  # Three WS2812 pixels on the board's RGB data line.
  - name: rgb_rmt
    type: rmt
    role: tx
    config:
      gpio_num: 8
      clk_src: RMT_CLK_SRC_DEFAULT
      resolution_hz: 10000000
      mem_block_symbols: 64
      trans_queue_depth: 4
      intr_priority: 1
      flags:
        invert_out: false
        with_dma: true
        io_loop_back: false
        io_od_mode: false
        allow_pd: false
        init_level: false

  - name: gpio_button_a
    type: gpio
    role: io
    config:
      pin: 0
      mode: GPIO_MODE_INPUT
      pull_up: true
      default_level: 1

  - name: gpio_button_b
    type: gpio
    role: io
    config:
      pin: 46
      mode: GPIO_MODE_INPUT
      pull_up: true
      default_level: 1
